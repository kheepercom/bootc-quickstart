name: fedora-bootc

on:
  push:
    branches: [main]
    paths: [fedora-bootc/**, .github/workflows/fedora-bootc.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/fedora-bootc

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: podman build -t $IMAGE:latest -t $IMAGE:main -t $IMAGE:${GITHUB_SHA::7} fedora-bootc
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: |
          podman push $IMAGE:latest
          podman push $IMAGE:main
          podman push $IMAGE:${GITHUB_SHA::7}
